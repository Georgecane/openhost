[package]
name = "openhost"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-3.0-only"
description = "Distributed resource infrastructure where the network is the machine."

[dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
rcgen = "0.14.10"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "deny"
